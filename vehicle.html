<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MENS 車輛履歷</title>

<style>
body {
  margin:0;
  font-family: sans-serif;
  color:#fff;

  /* 背景照片 */
  background:
  linear-gradient(to bottom, rgba(0,0,0,0.35), rgba(15,17,21,0.82)),
  url('IMG_2686.png');

  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  background-blend-mode: overlay;
}

.container { padding:16px; }

.brand-sub {
  font-size:11px;
  color:rgba(255,255,255,0.4);
  letter-spacing:2px;
}

/* Header */
.header {
  margin: 103px auto 90px;
  text-align: center;
  max-width: 520px;

  position: relative;
}

.hero-card {
  padding:30px 20px;

  border-radius:20px;

  background: rgba(0,0,0,0.25);

  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);

  border:1px solid rgba(255,255,255,0.08);

  box-shadow:
    0 20px 60px rgba(0,0,0,0.8),
    0 0 40px rgba(255,255,255,0.03) inset;
}

.header::before {
  content:"";
  position:absolute;
  top:-80px;
  left:50%;
  transform:translateX(-50%);

  width:500px;
  height:300px;

  background: radial-gradient(
    ellipse at center,
    rgba(255,255,255,0.08),
    transparent 70%
  );

  filter: blur(40px);
  z-index:-1;
}
  
.info-center {
  margin-top:10px;
}

.info-center .meta {
  font-size:12px;
  color:#aaa;
  margin-top:4px;
}  

.vid {
  font-size:12px;
  color:#aaa;
}
.status {
  display:inline-block;
  margin-top:9px;
  font-size:13px;
  padding:4px 10px;
  border-radius:19px;
  background:rgba(0,230,118,0.15);
  color:#00E676;
}

/* Card卡片樣式 */
.card {
  background: linear-gradient(
    to bottom,
    rgba(255,255,255,0.05),
    rgba(255,255,255,0)
  ), rgba(20,22,28,0.35);

  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);

  border-radius:14px;
  padding:16px;
  margin-bottom:16px;

  border:1px solid rgba(255,255,255,0.06);
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 30px rgba(0,0,0,0.6);
}

.card:active {
  transform: scale(0.97);
}
  
/* Warranty */
.bar-bg {
  width:100%;
  height:10px;
  background:#2A2E36;
  border-radius:999px;
  overflow:hidden;

  border:1px solid #333;/* 新增外框 */
  position:relative;
}
.bar {
  height:100%;
  border-radius:999px;
  box-shadow: 0 0 6px rgba(0,0,0,0.4) inset;
}

/* Footer */
.cta-bar {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#0F1115;
  padding:12px;

  padding-bottom: calc(12px + env(safe-area-inset-bottom));
}
  
.footer-cn {
  font-size:12px;
  color:#fff;
  letter-spacing:1px;
}

.footer-en {
  font-size:11px;
  color:rgba(255,255,255,0.5);
  letter-spacing:2px;
  margin-top:4px;
}

.footer-meta {
  font-size:11px;
  color:#aaa;
  line-height:1.6;
}

.footer-powered {
  font-size:10px;
  color:rgba(255,255,255,0.35);
}
  
.btn {
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  font-size:16px;
  background:#06C755;
  color:#fff;
}

/* Toast */
.toast {
  position:fixed;
  left:50%;
  transform:translateX(-50%) translateY(-10px);  /* 🔥 預設往上 */

  opacity: 0;
  visibility: hidden;   /* 🔥 用這個取代 display:none */

  top: 91px;
  bottom: auto;

  padding:10px 16px;

  background: rgba(20,22,28,0.55);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);

  border-radius:20px;
  font-size:12px;

  color: rgba(255,255,255,0.85);

  border:1px solid rgba(255,255,255,0.08);

  box-shadow:
    0 8px 30px rgba(0,0,0,0.6),
    0 0 10px rgba(255,255,255,0.05) inset;

  transition: all 0.4s ease;
}

.toast.show {
  opacity: 1;
  visibility: visible;
  transform: translateX(-50%) translateY(0);  /* 🔥 微上浮 */
}
  
  @keyframes blink {
  0% { opacity:1; }
  50% { opacity:0.3; }
  100% { opacity:1; }
}

.danger {
  animation: blink 1s infinite;
  box-shadow: 0 0 8px #E53935;
}

.main {
  background:rgba(0,0,0,0.1);
  border-radius:20px;
  padding:16px;
  padding-bottom:149px;

  margin-top:40px;
}

/* Header強化 */

.footer-info {
  text-align:center;
  font-size:11px;
  color:#888;
  margin:40px 0 80px;
  line-height:1.6;
}

/* 🔥 Header Ferrari版 */
.brand-hero {
  text-align:center;
  margin-bottom:19px;  /* 🔥增加間距 */

  filter: drop-shadow(0 10px 30px rgba(0,0,0,0.8));
}

.brand-hero img {
  height:91px;

  margin-bottom:6px;   /* 🔥從10 → 6（更貼近品牌） */

  opacity:0.9;        /* 🔥稍微降一點 */

  filter:
    drop-shadow(0 8px 20px rgba(0,0,0,0.8))
    drop-shadow(0 0 8px rgba(255,255,255,0.06));
  animation: breathe 4.1s ease-in-out infinite; /* LOGO呼吸感 */
}

.brand-name {
  font-size:14px;
  font-weight:600;
  margin-top:4px;
  letter-spacing:1px;
}

.cert-title {
  font-size:12px;
  letter-spacing:2px;
  color:#aaa;
  margin-bottom:8px;
}
  
.plate-big {
  text-align:center;
  font-size:48px;
  font-weight:700;
  margin-top:12px;
  letter-spacing:6px;

  background: linear-gradient(
    90deg,
    #ffffff 0%,
    #f5f5f5 40%,
    #dcdcdc 60%,
    #ffffff 100%
  );

  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;

  text-shadow:
    0 4px 20px rgba(0,0,0,0.8),
    0 0 10px rgba(255,255,255,0.08);

  animation: breathe 4.1s ease-in-out infinite; /* 車牌呼吸感 */
}
  
.brand-slogan {
  margin-top:20px;
  text-align:center;
  line-height:1.6;

  opacity:0;
  transform: translateY(12px);
  animation: sloganFade 1.2s ease forwards;
  animation-delay: 0.8s; /* 🔥 重點：晚一點出現 */
}

@keyframes sloganFade {
  to {
    opacity:0.85;
    transform: translateY(0);
  }
}

/* 第一行（品牌） */
.brand-slogan .s1 {
  font-size:11px;
  letter-spacing:2px;
  color:rgba(255,255,255,0.45);
}

/* 第二行（主殺句🔥） */
.brand-slogan .s3 {
  font-size:16px; /* 18 → 16 */
  font-weight:600;
  letter-spacing:2px;
  color:#fff;
  margin-top:4px;

  text-shadow:
    0 0 6px rgba(255,255,255,0.08);
}
    
.owner {
  text-align:center;
  font-size:12px;
  color:#bbb;
  margin-top:6px;
}

.car-info {
  text-align:center;
  font-size:13px;
  margin-top:4px;
  letter-spacing:1px;
}

.meta {
  font-size:12px;
  color:#aaa;
}

.footer-sign {
  margin-top:10px;
  font-size:10px;
  letter-spacing:2px;
  color:rgba(255,255,255,0.35);
}

  @keyframes breathe {
  0% {
    transform: scale(1);
    opacity: 0.9;
    filter: brightness(0.91);
  }
  50% {
    transform: scale(1.013); /* 大小變化！關鍵一點點 */
    opacity: 1;
    filter: brightness(1.31); /* 亮度變化！多一點 */
  }
  100% {
    transform: scale(1);
    opacity: 0.9;
    filter: brightness(0.91);
  }
}

  @media (max-width: 768px) {
  .header {
    margin: 80px auto 90px;
  }
}
  
</style>
</head>

<body>

<div class="container main">
  
  <!-- Header -->
<div class="header">
  <div class="hero-card">

  <!-- 品牌主體 -->
  <div class="brand-hero">
    <img src="IMG_2685.png">
    <div class="brand-name">MENS WRAP STUDIO</div>
  </div>

<div class="cert-title">
  Certified Vehicle Protection Record
</div>
    
  <!-- 車牌 -->
  <div class="plate-big"></div>

  <!-- 車主 -->
  <div class="owner">
    Owner：王先生
  </div>

  <!-- 車輛資訊 -->
 <div class="car-info"></div>

  <div class="brand-slogan">
  <div class="s1">曼司車體包膜</div>
  <div class="s3">定義車體保護的標準</div>
  </div>
    
</div>

  <!-- 狀態 -->
  <div class="info-center">
  <div class="status">已完工</div>
  <div class="meta">VID-000123</div>
</div>

  <!-- 綁定按鈕 -->
  <button id="bindBtn" style="margin-top:10px;display:none;">
    📱 綁定我的LINE
  </button>

</div>

  <!-- Warranty -->
  <div id="warranty"></div>
  <div id="timeline"></div>

</div>

<div class="footer-info">

  <!-- 中文主體 -->
  <div class="footer-cn">
    曼司車體包膜專業施工履歷系統
  </div>

  <!-- 英文輔助 -->
  <div class="footer-en">
    Certified Vehicle Protection Record
  </div>

  <br>

  <div class="footer-meta">
    Issued by MENS WRAP STUDIO<br>
    www.menswrap.com
  </div>

  <br>

  <div class="footer-powered">
    Powered by MENS CIM System
  </div>

  <div class="footer-sign">
  Standards Defined by MENS WRAP STUDIO
</div>

</div>
  
<!-- cta-bar 頁尾按紐-->
<div class="cta-bar">
  <button class="btn">立即預約 LINE 客服</button>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  請使用 LINE 掃描 QR Code 才可綁定
</div>

<script>

// ===== Mock Data =====
const mockData = {
  plate: "ABC-5678",
  brand: "Tesla",
  model: "Model Y",
  color: "White",

  materials: [
    { name:"PPF", part:"前保", batch:"XP123", bar:30 },
    { name:"鍍膜", part:"全車", batch:"", bar:15 },
    { name:"側裙", part:"", batch:"", bar:0 }
  ],

  works: [
    { date:"2025-06-10", item:"全車 PPF 完工", tech:"A123456 陳**" }
  ]
};

// ===== Render Warranty =====
function getColor(r){
  if(r <= 0) return "#E53935";
  if(r <= 1/7) return "#E53935";
  if(r <= 1/5) return "#FB8C00";
  if(r <= 1/3) return "#C0CA33";
  if(r <= 2/3) return "#66BB6A";
  return "#00E676";
}

function renderWarranty(materials){
  const el = document.getElementById("warranty");
  el.innerHTML = "";

  materials
    .sort((a,b)=>a.bar - b.bar)
    .forEach(w => {

      const percent = w.bar;
      const dangerClass = percent <= 0 ? "danger" : "";
      const borderColor = getBorderColor(percent/100);

      const div = document.createElement("div");
      div.className="card";

      div.innerHTML = `
        <div style="font-weight:600;font-size:15px;">
          ${w.name} ${w.part ? `（${w.part}）` : ""}
        </div>

        <div style="font-size:12px;color:#999;margin-bottom:8px;">
          ${w.batch ? `Batch: ${w.batch}` : ""}
        </div>

        <div class="bar-bg" style="border:1px solid ${borderColor}">
          <div class="bar ${dangerClass}" 
               style="width:${percent}%;background:${getColor(percent/100)}">
          </div>
        </div>

        <div style="font-size:12px;margin-top:4px;">${percent}%</div>
      `;

      el.appendChild(div);
    });
}

window.onload = function(){
  renderVehicle(mockData);
  renderWarranty(mockData.materials);
  renderTimeline(mockData.works);
};

function renderTimeline(works){

  const container = document.getElementById("timeline");

  document.querySelectorAll(".timeline-item").forEach(e=>e.remove());

  works.forEach(w => {

    const div = document.createElement("div");
    div.className = "card timeline-item";

    div.innerHTML = `
      <div>${w.date}</div>
      <div>${w.item}</div>
      <div style="font-size:12px;color:#aaa">${w.tech}</div>
    `;

    container.appendChild(div);
  });
}
  
// ===== LINE 判斷 =====
function isLine(){
  return navigator.userAgent.includes("Line");
}

// ===== 綁定按鈕控制 =====
if(isLine()){
  document.getElementById("bindBtn").style.display="block";
}else{
  setTimeout(() => {
    showToast("請使用 LINE 掃描 QR Code 才可綁定");
  }, 2500);   // 🔥 延遲出現
}

// ===== Toast =====
function showToast(msg){
  const t = document.getElementById("toast");
  t.innerText = msg;

  t.classList.add("show");

  setTimeout(() => {
    t.classList.remove("show");
  }, 3000);
}
  
// ===== 切車（先佔位）=====
function toggleCars(){
  alert("未來這裡做切車");
}

function renderVehicle(data){

document.querySelector(".plate-big").innerText = data.plate;

document.querySelector(".car-info").innerText =
    `${data.brand}｜${data.model}｜${data.color}`;
}

// ===== 血條外框 =====  
function getBorderColor(r){
  if(r <= 0) return "#E53935";     // 過期
  if(r <= 1/7) return "#E53935";   // 危險
  if(r <= 1/5) return "#FB8C00";   // 警告
  return "#333";
}  
  
// ===== 綁定（先佔位）=====
document.getElementById("bindBtn").onclick = function(){
  alert("這裡之後接 LIFF 綁定");
}

function getPlateFromURL(){
  const params = new URLSearchParams(window.location.search);
  return params.get("plate");
}

function handleData(data){

  console.log("API回傳:", data);

  if(data.error){
    console.log("錯誤:", data.error);
    showToast("查無資料");
    return;
  }

  // 🔥 主資料
  renderData(data);

  // 🔥 保固
  renderWarranty(data.materials || []);

  // 🔥 時間軸
  renderTimeline(data.works || []);
}
  
// ===== 測試資料 =====
function testAPI(){

  let plate = getPlateFromURL();

  // 🔥 沒帶就用測試車牌
  if(!plate){
    plate = "EBC5981";   // 你資料庫那台
  }

  console.log("查詢車牌:", plate);

  const url = `https://script.google.com/macros/s/AKfycbyBXU5p7oigkfwAuacwM8b84ui1EWPAiEdmbRgocoR-iviab2pjtT77y1IhedIrpPT3/exec?plate=${plate}&callback=handleData`;

  const script = document.createElement("script");
  script.src = url;
  document.body.appendChild(script);
}

}

function renderData(data){

  // 🔥 車牌（大字）
  const plateEl = document.querySelector(".plate-big");
  if(plateEl){
    plateEl.innerText = data.plate || "---";
  }

  // 🔥 車主
  const ownerEl = document.querySelector(".owner");
  if(ownerEl){
    ownerEl.innerText = "Owner："+(data.owner || "---");
  }

  // 🔥 車輛資訊
  const carEl = document.querySelector(".car-info");
  if(carEl){
    carEl.innerText =
      `${data.brand || ""}｜${data.model || ""}｜${data.color || ""}`;
  }

}
  
// ===== 讀資料 =====
async function loadData(){

  // 🔥 之後這裡會動態帶車牌（先寫死測試）
  const plate = "ABC-5678";

  const url = "https://script.google.com/macros/s/AKfycbyBXU5p7oigkfwAuacwM8b84ui1EWPAiEdmbRgocoR-iviab2pjtT77y1IhedIrpPT3/exec?plate=" + plate;

  try{
    const res = await fetch(url);
    const data = await res.json();

    console.log("API資料：", data);

    renderVehicle(data);
    renderWarranty(data.materials);
    renderTimeline(data.works);

  }catch(err){
    console.error("讀取失敗", err);
    showToast("資料讀取失敗");
  }
}

window.onload = function(){
  testAPI();   // 🔥 這行才是真正啟動
};
  
</script>

</body>
</html>

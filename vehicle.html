 /* sloagn 第一句*/

/* 🔥 文字背景絲滑掃光 */
.s3.shine {
  background: linear-gradient(
    100deg,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,0.5) 45%,
    rgba(255,255,255,1) 49%,
    rgba(255,255,255,0.8) 50%,
    rgba(255,255,255,1) 51%,
    rgba(255,255,255,0.5) 55%,
    rgba(255,255,255,0) 100%
  );

  background-size: 150% auto;
  background-position: -120% center;

  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;

  animation: textShine 2.6s cubic-bezier(0.4, 0, 0.2, 1);
  animation-fill-mode: none;
}

.s3.shine::after {
  display: none;
  content: "";
  position: absolute;
  top: 0;
  left: -120%;

  width: 40%;
  height: 100%;

  background: linear-gradient(
    100deg,

    rgba(255,255,255,0.85) 50%,
    rgba(255,255,255,0.25) 65%,

  );

  filter: blur(3px);
  opacity: 0;

  animation: smoothShine 2.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}

/* 🔥 背後透光（高級版） */
.s3.shine::before {
  z-index: 2;
  content: "";
  position: absolute;
  left: -40%;
  top: 50%;
  transform: translateY(-50%);

  width: 68%;        /* 🔥 收窄（不要68%） */

  rgba(255,255,255,0.1) 55%,
  rgba(255,255,255,0) 75%
);

  pointer-events: none;

/* 🔥 掃光過.S3（高級版） */

  0% {
    left: -41%;
    opacity: 0;
  }

  20% {
    opacity: 1;
  }

    opacity: 1;
  }

  100% {

  }
}

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script>
// ===== 讀LINE用戶頭像和名稱 =====
let LINE_PROFILE = null;

async function initLine(){
  try{
    await liff.init({ liffId: "2009682379-TbLPDrAQ" });

    if(!liff.isLoggedIn()){
      liff.login();
      return;
    }

    const profile = await liff.getProfile();

    LINE_PROFILE = {
      name: profile.displayName,
      avatar: profile.pictureUrl,
      userId: profile.userId
    };

  }catch(e){
    console.log("LIFF init 失敗", e);
  }
}  

// 🔥 統一參數（防大小寫）
function getParam(params, key){

  const keys = [
    key,
    key.toLowerCase(),
    key.toUpperCase(),

    // 🔥 常見變形（重點）
    key.charAt(0).toLowerCase() + key.slice(1), // VehicleID → vehicleID
    key.replace("ID","Id"),                    // VehicleID → VehicleId
    key.replace("ID","id"),                    // VehicleID → Vehicleid
  ];

  for(let k of keys){
    const v = params.get(k);
    if(v && v !== "") return v;
  }

  return null;
}
  
// ===== 分辨 技師 / 綁定客戶 / 一般客戶=====
function getViewType(){

  const params = new URLSearchParams(window.location.search);

  const plate = getParam(params, "plate");
  const vehicleId = getParam(params, "VehicleID");
  const mode = getParam(params, "mode");

  // 🔥 技師模式（最高優先）
  if(vehicleId){
    return {
      type: "tech",
      value: vehicleId
    };
  }

  // 🔥 LINE 多車模式
  if(mode === "mycar"){
    return {
      type: "mycar",
      value: ""
    };
  }

  // 🔥 客戶模式
  if(plate){
    return {
      type: "customer",
      value: plate
    };
  }

  return {
    type: "unknown",
    value: ""
  };
}
  
// ===== renderOwnerProfile =====
function renderOwnerProfile(profile){

  const ownerEl = document.querySelector(".owner");

  ownerEl.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:center;gap:8px;">
      <img src="${profile.avatar}" 
           style="width:26px;height:26px;border-radius:50%;">
      <span>${profile.name}</span>
    </div>
  `;
}
  
// ===== Render Warranty =====
function getColor(r){
  if(r <= 0) return "#E53935";
  if(r <= 1/7) return "#E53935";
  if(r <= 1/5) return "#FB8C00";
  if(r <= 1/3) return "#C0CA33";
  if(r <= 2/3) return "#66BB6A";
  return "#00E676";
}

function renderWarranty(materials){
  const el = document.getElementById("warranty");
  el.innerHTML = "";

  materials
    .sort((a,b)=>a.bar - b.bar)
    .forEach(w => {

      const percent = w.bar;
      const dangerClass = percent <= 0 ? "danger" : "";
      const borderColor = getBorderColor(percent/100);

      const expiredLabel = percent <= 0 ? 
  `<div style="color:#E53935;font-size:12px;margin-top:6px;">
     ⚠ 已過保固
   </div>` : "";

      const div = document.createElement("div");
      div.className="card";

      div.innerHTML = `
        <div style="font-weight:600;font-size:15px;">
          ${w.name} ${w.part ? `（${w.part}）` : ""}
        </div>

        <div style="font-size:12px;color:#999;margin-bottom:8px;">
          ${w.batch ? `Batch: ${w.batch}` : ""}
        </div>

        <div class="bar-bg" style="border:1px solid ${borderColor}">
          <div class="bar ${dangerClass}" 
     style="
       width:${percent <= 0 ? '100%' : percent + '%'};
       background:${percent <= 0 ? '#E53935' : getColor(percent/100)};
       opacity:${percent <= 0 ? '0.8' : '1'};
     ">
</div>
        </div>

        <div style="font-size:12px;margin-top:4px;">${percent}%</div>
         ${expiredLabel}
      `;

      el.appendChild(div);
    });
}

function renderTimeline(works){

  if(!works || works.length === 0){
    console.log("⚠️ timeline 沒資料");
    return;
  }

  const container = document.getElementById("timeline");
  container.innerHTML = "";

  const view = getViewType();

  const typeOrder = ["施工","維護","回檢/修補","其他"];

  // ===== 分組：日期 → 類型 =====
  const grouped = {};

  works.forEach(w => {

    const date = formatDate(w.date);

    let type = w.type;
    if(!type || type === "") type = "施工";

    if(!grouped[date]) grouped[date] = {};
    if(!grouped[date][type]) grouped[date][type] = [];

    grouped[date][type].push(w);
  });

  const dates = Object.keys(grouped)
    .sort((a,b)=> new Date(b) - new Date(a));

  dates.forEach(date => {

    // 日期
    const dateEl = document.createElement("div");
    dateEl.style.margin = "20px 0 10px";
    dateEl.style.fontSize = "13px";
    dateEl.style.color = "#aaa";
    dateEl.innerText = date;
    container.appendChild(dateEl);

    const types = Object.keys(grouped[date])
      .sort((a,b)=> typeOrder.indexOf(a) - typeOrder.indexOf(b));

    types.forEach(type => {

      const items = grouped[date][type];

      const card = document.createElement("div");
      card.className = "card timeline-item";
      card.style.position = "relative";
      card.style.paddingLeft = "20px";
      card.style.borderLeft = "2px solid rgba(255,255,255,0.08)";

      // 左側點
      const dot = document.createElement("div");
      dot.style.position = "absolute";
      dot.style.left = "-6px";
      dot.style.top = "18px";
      dot.style.width = "10px";
      dot.style.height = "10px";
      dot.style.borderRadius = "50%";
      dot.style.background = "#00E676";
      dot.style.boxShadow = "0 0 8px rgba(0,230,118,0.6)";
      card.appendChild(dot);

      // 類型
      const title = document.createElement("div");
      title.style.fontSize = "13px";
      title.style.marginBottom = "6px";
      title.style.color = "#00E676";
      title.innerText = `[${type}]`;
      card.appendChild(title);

      // ===== 🔥 階層分組（核心） =====
      const groupMap = {};

      items.forEach(w => {

  const parts = w.item.split(" - ").map(p => p.trim());

  const main = parts[0] || "";
  const sub = parts[1] || "";
  const action = parts[2] || "";

  if(!groupMap[main]){
    groupMap[main] = { subMap: {} };
  }

  if(!groupMap[main].subMap[sub]){
    groupMap[main].subMap[sub] = new Set();
  }

  if(action){
    groupMap[main].subMap[sub].add(action);
  }else{
    groupMap[main].subMap[sub].add("");
  }

});

      // ===== render 分組 =====
Object.keys(groupMap).forEach(main => {

  // 主分類
  const mainEl = document.createElement("div");
  mainEl.style.fontSize = "14px";
  mainEl.style.color = "#fff";
  mainEl.style.marginTop = "6px";
  mainEl.innerText = main;
  card.appendChild(mainEl);

  // 子分類
  Object.keys(groupMap[main].subMap).forEach(sub => {

    const actions = Array.from(groupMap[main].subMap[sub])
      .filter(a => a);

    const text = actions.length > 0
      ? `${sub} - ${actions.join(" / ")}`
      : sub;

    const subEl = document.createElement("div");
    subEl.style.fontSize = "13px";
    subEl.style.color = "#ccc";
    subEl.style.marginLeft = "10px";
    subEl.innerText = `- ${text}`;

    card.appendChild(subEl);

  });

});

      // ===== 技師（右下）=====
      const techSet = new Set();

      items.forEach(w => {
        const name = view.type === "tech"
          ? (w.techFull || w.tech)
          : w.tech;

        if(name) techSet.add(name);
      });

      const techBox = document.createElement("div");
      techBox.style.marginTop = "10px";
      techBox.style.textAlign = "right";
      techBox.style.fontSize = "12px";
      techBox.style.color = "#aaa";

      techSet.forEach(t => {
        const line = document.createElement("div");
        line.innerText = t;
        techBox.appendChild(line);
      });

      card.appendChild(techBox);

      container.appendChild(card);
    });

  });
}

function handleData(data){

  console.log("cars:", data.cars);

  window._DATA_READY = true;

  if(data.error){
    showToast("查無資料");
    return;
  }

  // 🔥 主資料
  renderData(data);

  // 🔥 保固
  renderWarranty(data.materials || []);

  // 🔥 時間軸
  renderTimeline(data.works || []);

  // 🔥 綁定狀態
  if(data.isBound){

    const bindStatus = document.getElementById("bindStatus");
    bindStatus.style.display = "inline-block";
    bindStatus.classList.add("show");

    const btn = document.getElementById("bindBtn");
    btn.style.display = "none";
  }

  // 🔥 多車下拉 + 切換（完整版）
  if(data.cars && data.cars.length > 1){

    const select = document.getElementById("carSelect");

    select.style.display = "block";
    select.innerHTML = "";

    data.cars.forEach(p => {
      const opt = document.createElement("option");
      opt.value = p;
      opt.textContent = p;
      select.appendChild(opt);
    });

    select.value = data.plate;

    // ✅🔥 切換車輛（一定要在這裡）
    select.onchange = function(){

      const newPlate = this.value;

      const userId = LINE_PROFILE?.userId || "";

      window.location.href =
        window.location.pathname +
        "?plate=" + encodeURIComponent(newPlate) +
        "&userId=" + encodeURIComponent(userId);

    };
  }
}
  
function formatDate(d){
  if(!d) return "";

  const date = new Date(d);

  if(isNaN(date.getTime())) return d;

  return date.getFullYear() + "/" + 
         (date.getMonth()+1) + "/" + 
         date.getDate();
}
  
function renderData(data){

  // 🔥 車牌（大字）
  const plateEl = document.querySelector(".plate-big");
  if(plateEl){
    plateEl.innerText = data.plate || "---";
  }

  // 案件狀態
  const statusEl = document.querySelector(".status");

if(statusEl){

  const status = data.status || "未知";

  let color = "#999";
  let bg = "rgba(255,255,255,0.1)";

  if(status === "施工中"){
    color = "#f1c40f";
    bg = "rgba(241,196,15,0.15)";
  }
  else if(status === "已完工"){
    color = "#00E676";
    bg = "rgba(0,230,118,0.15)";
  }
  else if(status === "結案"){
   color = "#00E676";
    bg = "rgba(0,230,118,0.15)";
  }
  else if(status === "待施工"){
    color = "#bbb";
    bg = "rgba(255,255,255,0.08)";
  }

  statusEl.innerText = status;
  statusEl.style.color = color;
  statusEl.style.background = bg;
  statusEl.classList.add("show");

}

  // 🔥 車主
  const ownerEl = document.querySelector(".owner");
  if(LINE_PROFILE){
  renderOwnerProfile(LINE_PROFILE);
}else{
  ownerEl.innerText = "Owner："+(data.owner || "---");
}

  // 🔥 車輛資訊
  const carEl = document.querySelector(".car-info");
  if(carEl){
    carEl.innerText =
      `${data.brand || ""}｜${data.model || ""}｜${data.color || ""}`;
  }

  const metaEl = document.querySelector(".meta");

if(metaEl){
  metaEl.innerText = `VID｜${data.vehicleId || "---"}`;
}

}
  
// ===== 讀資料 =====
function loadData(){

  const params = new URLSearchParams(window.location.search);

const plate = getParam(params, "plate");
const mode = getParam(params, "mode");
const vehicleId = getParam(params, "VehicleID");

// 🔥 防呆（只擋客戶模式）
if(!plate && !vehicleId && mode !== "mycar"){
  showToast("缺少車牌參數");
  return;
}

let url =
"https://script.google.com/macros/s/AKfycbyBXU5p7oigkfwAuacwM8b84ui1EWPAiEdmbRgocoR-iviab2pjtT77y1IhedIrpPT3/exec";

// 🔥 技師模式（最高優先）
if(vehicleId){

  url += "?VehicleID=" + encodeURIComponent(vehicleId)
       + "&callback=handleData";

// 🔥 LINE 多車
}else if(mode === "mycar"){

  const userId = LINE_PROFILE?.userId || "";

  url += "?userId=" + encodeURIComponent(userId)
       + "&callback=handleData";

// 🔥 客戶 QR
}else{

  url += "?plate=" + encodeURIComponent(plate)
       + "&userId=" + encodeURIComponent(LINE_PROFILE?.userId || "")
       + "&callback=handleData";
}

const script = document.createElement("script");
script.src = url;
document.body.appendChild(script);
}

// ===== 主卡片資料出現時序控制 =====
window.onload = async function(){
  await initLine(); // 載入用戶頭像和名稱
  const view = getViewType();

  if(view.type === "tech"){
    document.body.classList.add("tech-mode");
  }

  const s1 = document.querySelector(".s1");
  const s3 = document.querySelector(".s3");

  // ① 第一段 slogan
  setTimeout(() => {
    s1.classList.add("show");

    // ② 第二段 slogan 出現
    setTimeout(() => {
      s3.classList.add("show");

      // ③ 掃光開始
      setTimeout(() => {
        s3.classList.add("shine");

        // ④ 掃光結束
        setTimeout(() => {
          s3.classList.remove("shine");

          // ⑤ 最後才載資料（畫面穩定後）
          loadData();

        }, 1900); // shine duration

      }, 900); // show → shine 間隔

    }, 900); // s1 → s3 間隔

  }, 2800);

};

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MENS 車輛履歷</title>

<style>
body {
  margin:0;
  font-family: sans-serif;
  color:#fff;

  /* 背景照片 */
  background:
  linear-gradient(to bottom, rgba(0,0,0,0.35), rgba(15,17,21,0.82)),
  url('IMG_2686.png');

  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  background-blend-mode: overlay;
}

.container { padding:16px; }

.brand-sub {
  font-size:11px;
  color:rgba(255,255,255,0.4);
  letter-spacing:2px;
}

/* Header */
.header {
  margin: 130px auto 60px;
  text-align: center;
  max-width: 520px;

  position: relative;
}

.hero-card {
  padding:30px 20px;

  border-radius:20px;

  background: rgba(0,0,0,0.25);

  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);

  border:1px solid rgba(255,255,255,0.08);

  box-shadow:
    0 20px 60px rgba(0,0,0,0.8),
    0 0 40px rgba(255,255,255,0.03) inset;
}

.header::before {
  content:"";
  position:absolute;
  top:-80px;
  left:50%;
  transform:translateX(-50%);

  width:500px;
  height:300px;

  background: radial-gradient(
    ellipse at center,
    rgba(255,255,255,0.08),
    transparent 70%
  );

  filter: blur(40px);
  z-index:-1;
}
  
.info-center {
  margin-top:10px;
}

.info-center .meta {
  font-size:12px;
  color:#aaa;
  margin-top:4px;
}  

.vid {
  font-size:12px;
  color:#aaa;
}
.status {
  display:inline-block;
  margin-top:9px;
  font-size:13px;
  padding:4px 10px;
  border-radius:19px;
  background:rgba(0,230,118,0.15);
  color:#00E676;
}

/* Card卡片樣式 */
.card {
  background: linear-gradient(
    to bottom,
    rgba(255,255,255,0.05),
    rgba(255,255,255,0)
  ), rgba(20,22,28,0.35);

  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);

  border-radius:14px;
  padding:16px;
  margin-bottom:16px;

  border:1px solid rgba(255,255,255,0.06);
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 30px rgba(0,0,0,0.6);
}

.card:active {
  transform: scale(0.97);
}
  
/* Warranty */
.bar-bg {
  width:100%;
  height:10px;
  background:#2A2E36;
  border-radius:999px;
  overflow:hidden;

  border:1px solid #333;/* 新增外框 */
  position:relative;
}
.bar {
  height:100%;
  border-radius:999px;
  box-shadow: 0 0 6px rgba(0,0,0,0.4) inset;
}

/* Footer */
.footer {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#0F1115;
  padding:12px;
}
.btn {
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  font-size:16px;
  background:#06C755;
  color:#fff;
}

/* Toast */
.toast {
  position:fixed;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
  background:#333;
  padding:10px 16px;
  border-radius:20px;
  font-size:12px;
  display:none;
}
  @keyframes blink {
  0% { opacity:1; }
  50% { opacity:0.3; }
  100% { opacity:1; }
}

.danger {
  animation: blink 1s infinite;
  box-shadow: 0 0 8px #E53935;
}

.main {
  background:rgba(0,0,0,0.1);
  border-radius:20px;
  padding:16px;

  margin-top:40px;
}

/* Header強化 */

.footer-info {
  text-align:center;
  font-size:11px;
  color:#888;
  margin:40px 0 80px;
  line-height:1.6;
}

/* 🔥 Header Ferrari版 */
.brand-hero {
  text-align:center;
  margin-bottom:19px;  /* 🔥增加間距 */

  filter: drop-shadow(0 10px 30px rgba(0,0,0,0.8));
}

.brand-hero img {
  height:91px;

  margin-bottom:6px;   /* 🔥從10 → 6（更貼近品牌） */

  opacity:0.9;        /* 🔥稍微降一點 */

  filter:
    drop-shadow(0 8px 20px rgba(0,0,0,0.8))
    drop-shadow(0 0 8px rgba(255,255,255,0.06));
}

.brand-name {
  font-size:14px;
  font-weight:600;
  margin-top:4px;
  letter-spacing:1px;
}

.cert-title {
  font-size:12px;
  letter-spacing:2px;
  color:#aaa;
  margin-bottom:8px;
}
  
.plate-big {
  text-align:center;
  font-size:48px;
  font-weight:700;
  margin-top:12px;
  letter-spacing:5px;

  background: linear-gradient(
    90deg,
    #ffffff 0%,
    #f5f5f5 40%,
    #dcdcdc 60%,
    #ffffff 100%
  );

  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;

  text-shadow:
    0 4px 20px rgba(0,0,0,0.8),
    0 0 10px rgba(255,255,255,0.08);
transform: scale(1.05);
letter-spacing:6px;
}

.owner {
  text-align:center;
  font-size:12px;
  color:#bbb;
  margin-top:6px;
}

.car-info {
  text-align:center;
  font-size:13px;
  margin-top:4px;
  letter-spacing:1px;
}

.meta {
  font-size:12px;
  color:#aaa;
}
  
</style>
</head>

<body>

<div class="container main">
  
  <!-- Header -->
<div class="header">
  <div class="hero-card">

  <!-- 品牌主體 -->
  <div class="brand-hero">
    <img src="IMG_2685.png">
    <div class="brand-name">MENS WRAP STUDIO</div>
  </div>

<div class="cert-title">
  Certified Vehicle Protection Record
</div>
    
  <!-- 車牌 -->
  <div class="plate-big">
    ABC-1234
  </div>

  <!-- 車主 -->
  <div class="owner">
    Owner：王先生
  </div>

  <!-- 車輛資訊 -->
  <div class="car-info">
    Tesla｜Model Y｜White
  </div>
    
</div>

  <!-- 狀態 -->
  <div class="info-center">
  <div class="status">已完工</div>
  <div class="meta">VID-000123</div>
</div>

  <!-- 綁定按鈕 -->
  <button id="bindBtn" style="margin-top:10px;display:none;">
    📱 綁定我的LINE
  </button>

</div>

  <!-- Warranty -->
  <div id="warranty"></div>

  <!-- Timeline -->
  <div class="card">
    <div>2025-06-10</div>
    <div>全車 PPF 完工</div>
    <div style="font-size:12px;color:#aaa;">A123456 陳**</div>
  </div>

</div>

<div class="footer-info">
  <div>Certified Vehicle Protection Record</div>
  <div>曼司車體包膜專業施工履歷系統</div>

  <br>

  <div>Issued by</div>
  <div>MENS WRAP STUDIO</div>
  <div>www.menswrap.com</div>

  <br>

  <div>Powered by MENS CIM System</div>
</div>
  
<!-- Footer -->
<div class="footer">
  <button class="btn">立即預約 LINE 客服</button>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  請使用 LINE 掃描 QR Code 才可綁定
</div>

<script>

// ===== Mock Data =====
const data = {
  warranty: [
    {name:"PPF", area:"前保", ratio:0.3,
 brand:"SunTek", series:"ONE", material:"PPF（5年保固）", batch:"32096009"},

{name:"鍍膜", area:"全車", ratio:0.15,
 brand:"CarPro", series:"", material:"鍍膜（1.5年）", batch:"MPC BASIC"},

{name:"側裙", area:"", ratio:0,
 brand:"", series:"", material:"", batch:""}
  ]
};

// ===== Render Warranty =====
function getColor(r){
  if(r <= 0) return "#E53935";
  if(r <= 1/7) return "#E53935";
  if(r <= 1/5) return "#FB8C00";
  if(r <= 1/3) return "#C0CA33";
  if(r <= 2/3) return "#66BB6A";
  return "#00E676";
}

function renderWarranty(){
  const el = document.getElementById("warranty");
  el.innerHTML = "";

  data.warranty
    .sort((a,b)=>a.ratio-b.ratio)
    .forEach(w => {
      const percent = Math.max(5, Math.round(w.ratio*100));
      const dangerClass = w.ratio <= 0 ? "danger" : "";
      const borderColor = getBorderColor(w.ratio); // 🔥加這行
      const div = document.createElement("div");
      div.className="card";

      div.innerHTML = `
  <div style="font-weight:600;font-size:15px;">
    ${w.name} ${w.area ? `（${w.area}）` : ""}
  </div>

  <div style="font-size:13px;color:#ccc;margin-top:4px;">
    ${w.brand ? w.brand : ""} 
    ${w.series ? "｜" + w.series : ""} 
    ${w.material ? "｜" + w.material : ""}
  </div>

  <div style="font-size:12px;color:#999;margin-bottom:8px;">
    ${w.batch ? `Batch: ${w.batch}` : ""}
  </div>

  <div class="bar-bg" style="border:1px solid ${borderColor}">
    <div class="bar ${dangerClass}" 
         style="width:${percent}%;background:${getColor(w.ratio)}">
    </div>
  </div>

  <div style="font-size:12px;margin-top:4px;">${percent}%</div>
`;

      el.appendChild(div);
    });
}

renderWarranty();

// ===== LINE 判斷 =====
function isLine(){
  return navigator.userAgent.includes("Line");
}

// ===== 綁定按鈕控制 =====
if(isLine()){
  document.getElementById("bindBtn").style.display="block";
}else{
  showToast();
}

// ===== Toast =====
function showToast(){
  const t = document.getElementById("toast");
  t.style.display="block";
  setTimeout(()=>t.style.display="none",3000);
}
  
// ===== 切車（先佔位）=====
function toggleCars(){
  alert("未來這裡做切車");
}

// ===== 血條外框 =====  
function getBorderColor(r){
  if(r <= 0) return "#E53935";     // 過期
  if(r <= 1/7) return "#E53935";   // 危險
  if(r <= 1/5) return "#FB8C00";   // 警告
  return "#333";
}  
  
// ===== 綁定（先佔位）=====
document.getElementById("bindBtn").onclick = function(){
  alert("這裡之後接 LIFF 綁定");
}

</script>

</body>
</html>
